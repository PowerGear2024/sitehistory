<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Адмін — SiteHistory</title>
  <style>
    @font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:400;src:url("fonts/manrope-cyrillic-400-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:400;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:600;src:url("fonts/manrope-cyrillic-600-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:"Manrope";font-style:normal;font-display:swap;font-weight:600;src:url("fonts/manrope-latin-600-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:"Cormorant Garamond";font-style:normal;font-display:swap;font-weight:500;src:url("fonts/cormorant-garamond-cyrillic-500-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:"Cormorant Garamond";font-style:normal;font-display:swap;font-weight:500;src:url("fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    :root {
      --bg: #080a0c; --bg-2: #0e1210; --ink: #f3f0e8; --muted: #8f968c;
      --sand: #e0b57a; --sea: #6eb5a4; --ember: #c4785a; --line: rgba(243,240,232,.12);
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-body: "Manrope", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: var(--font-body); color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 15% 0%, rgba(224,181,122,.12), transparent 50%),
        linear-gradient(180deg, #050607, var(--bg) 40%, var(--bg-2));
      padding: 1.25rem 1rem 3rem;
    }
    .wrap { width: min(920px, 100%); margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; }
    h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .meta { color: var(--muted); font-size: .85rem; }
    a.link { color: var(--sand); text-decoration: none; border-bottom: 1px solid rgba(224,181,122,.35); }
    .panel {
      padding: 1.2rem; border-radius: 18px; background: rgba(255,255,255,.045);
      border: 1px solid var(--line); margin-bottom: 1rem;
    }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
    input[type=password], input[type=text], textarea, select {
      width: 100%; padding: .7rem .85rem; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(6,8,8,.55); color: var(--ink);
      font-family: var(--font-body); font-size: .95rem; outline: none;
    }
    textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
    input:focus, textarea:focus, select:focus { border-color: rgba(224,181,122,.5); box-shadow: 0 0 0 3px rgba(224,181,122,.2); }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; margin-top: .85rem; }
    .row > * { flex: 1 1 140px; }
    button {
      border: none; border-radius: 999px; cursor: pointer; font-family: var(--font-body);
      font-weight: 600; font-size: .88rem; padding: .62rem 1.15rem;
    }
    .btn-sand { background: linear-gradient(135deg, #f3e0c2, #e0b57a 50%, #9fd0c2); color: #1a140e; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-danger { background: rgba(196,120,90,.2); color: #f0c0a8; border: 1px solid rgba(196,120,90,.45); }
    .btn-sea { background: rgba(110,181,164,.2); color: var(--sea); border: 1px solid rgba(110,181,164,.4); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(140%);
      z-index: 50; padding: .75rem 1.1rem; border-radius: 999px; background: rgba(16,18,16,.96);
      border: 1px solid rgba(224,181,122,.4); font-size: .86rem; transition: transform .35s ease;
      max-width: calc(100vw - 2rem); text-align: center; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; align-items: center; margin: 1rem 0 .75rem; }
    .search { max-width: 280px; }
    .list { display: grid; gap: .85rem; }
    .card {
      padding: 1rem; border-radius: 16px; border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
    }
    .card.editing { border-color: rgba(224,181,122,.45); box-shadow: 0 0 0 3px rgba(224,181,122,.12); }
    .card-top { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; margin-bottom: .55rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .55rem;
      border-radius: 999px; font-size: .72rem; border: 1px solid var(--line); color: var(--muted);
    }
    .badge.named { color: var(--sea); border-color: rgba(110,181,164,.4); }
    .card-text { white-space: pre-wrap; line-height: 1.5; font-size: .95rem; margin-bottom: .75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; }
    .edit-grid { display: grid; gap: .65rem; margin-top: .35rem; }
    .hidden { display: none !important; }
    .empty { color: var(--muted); padding: 1.5rem 0; text-align: center; }
    .id { font-size: .7rem; color: rgba(143,150,140,.75); word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Адмін SiteHistory</h1>
        <p class="meta">Редагування й видалення карток (модерація)</p>
      </div>
      <a class="link" href="index.html">← На сайт</a>
    </header>

    <section class="panel" id="loginPanel">
      <label for="password">Пароль адміна</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
      <div class="row">
        <button type="button" class="btn-sand" id="loginBtn">Увійти</button>
      </div>
    </section>

    <section id="moderation" class="hidden">
      <div class="toolbar">
        <div class="meta" id="sessionMeta">Сесія активна</div>
        <div class="actions">
          <input class="search" type="text" id="search" placeholder="Пошук по тексту / імені" />
          <button type="button" class="btn-ghost" id="refreshBtn">Оновити</button>
          <button type="button" class="btn-ghost" id="logoutBtn">Вийти</button>
        </div>
      </div>
      <div class="list" id="list"></div>
      <p class="empty hidden" id="empty">Немає карток</p>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
  (function () {
    "use strict";
    var API = "/sitehistory/api";
    var TOKEN_KEY = "sitehistory_admin_token";
    var TONES = ["tone-amber","tone-rose","tone-sky","tone-mint","tone-lilac","tone-peach","tone-cream"];
    var token = localStorage.getItem(TOKEN_KEY) || "";
    var stories = [];
    var toastTimer = null;

    var loginPanel = document.getElementById("loginPanel");
    var moderation = document.getElementById("moderation");
    var password = document.getElementById("password");
    var loginBtn = document.getElementById("loginBtn");
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var search = document.getElementById("search");
    var toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2800);
    }

    function authHeaders(extra) {
      var h = extra || {};
      if (token) h.Authorization = "Bearer " + token;
      return h;
    }

    function setLoggedIn(on) {
      loginPanel.classList.toggle("hidden", on);
      moderation.classList.toggle("hidden", !on);
    }

    function formatTime(ts) {
      try {
        return new Date(ts).toLocaleString("uk-UA", { dateStyle: "short", timeStyle: "short" });
      } catch (e) {
        return String(ts);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function filtered() {
      var q = (search.value || "").trim().toLowerCase();
      if (!q) return stories.slice();
      return stories.filter(function (s) {
        return (s.text || "").toLowerCase().indexOf(q) >= 0 ||
          (s.author || "").toLowerCase().indexOf(q) >= 0 ||
          (s.id || "").toLowerCase().indexOf(q) >= 0;
      });
    }

    function render() {
      var items = filtered();
      empty.classList.toggle("hidden", items.length > 0);
      list.innerHTML = items.map(function (s) {
        var author = s.anonymous ? "анонімно" : (s.author || "—");
        return (
          '<article class="card" data-id="' + escapeHtml(s.id) + '">' +
            '<div class="card-top">' +
              '<span class="badge ' + (s.anonymous ? "" : "named") + '">' + escapeHtml(author) + " · " + escapeHtml(s.tone) + "</span>" +
              '<span class="meta">' + escapeHtml(formatTime(s.createdAt)) + "</span>" +
            "</div>" +
            '<p class="card-text">' + escapeHtml(s.text) + "</p>" +
            '<p class="id">' + escapeHtml(s.id) + "</p>" +
            '<div class="actions view-actions">' +
              '<button type="button" class="btn-sea btn-edit">Редагувати</button>' +
              '<button type="button" class="btn-danger btn-delete">Видалити</button>' +
            "</div>" +
            '<div class="edit-grid hidden">' +
              '<div><label>Текст</label><textarea class="edit-text">' + escapeHtml(s.text) + "</textarea></div>" +
              '<div class="row">' +
                '<div><label>Режим</label><select class="edit-anon">' +
                  '<option value="1"' + (s.anonymous ? " selected" : "") + ">Анонімно</option>" +
                  '<option value="0"' + (!s.anonymous ? " selected" : "") + ">З іменем</option>" +
                "</select></div>" +
                '<div><label>Імʼя</label><input type="text" class="edit-author" maxlength="40" value="' + escapeHtml(s.author || "") + '"' + (s.anonymous ? " disabled" : "") + " /></div>" +
                '<div><label>Тон</label><select class="edit-tone">' +
                  TONES.map(function (t) {
                    return '<option value="' + t + '"' + (s.tone === t ? " selected" : "") + ">" + t.replace("tone-", "") + "</option>";
                  }).join("") +
                "</select></div>" +
              "</div>" +
              '<div class="actions">' +
                '<button type="button" class="btn-sand btn-save">Зберегти</button>' +
                '<button type="button" class="btn-ghost btn-cancel">Скасувати</button>' +
              "</div>" +
            "</div>" +
          "</article>"
        );
      }).join("");
    }

    function loadStories() {
      return fetch(API + "/stories?limit=200", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("load"); return r.json(); })
        .then(function (data) {
          stories = (data.stories || []).slice();
          render();
          document.getElementById("sessionMeta").textContent = "Карток: " + stories.length;
        });
    }

    function checkSession() {
      if (!token) {
        setLoggedIn(false);
        return Promise.resolve(false);
      }
      return fetch(API + "/admin/me", { headers: authHeaders(), cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("auth");
          return r.json();
        })
        .then(function () {
          setLoggedIn(true);
          return loadStories().then(function () { return true; });
        })
        .catch(function () {
          token = "";
          localStorage.removeItem(TOKEN_KEY);
          setLoggedIn(false);
          return false;
        });
    }

    function login() {
      loginBtn.disabled = true;
      fetch(API + "/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password.value || "" })
      })
        .then(function (r) {
          return r.json().then(function (data) {
            if (!r.ok) throw new Error(data.message || data.error || "login");
            return data;
          });
        })
        .then(function (data) {
          token = data.token;
          localStorage.setItem(TOKEN_KEY, token);
          password.value = "";
          setLoggedIn(true);
          showToast("Вхід успішний");
          return loadStories();
        })
        .catch(function (err) {
          showToast(err.message || "Невірний пароль");
        })
        .then(function () { loginBtn.disabled = false; });
    }

    function logout() {
      fetch(API + "/admin/logout", { method: "POST", headers: authHeaders() }).catch(function () {});
      token = "";
      localStorage.removeItem(TOKEN_KEY);
      setLoggedIn(false);
      showToast("Вийшли");
    }

    function findCard(el) {
      return el.closest(".card");
    }

    list.addEventListener("click", function (e) {
      var card = findCard(e.target);
      if (!card) return;
      var id = card.getAttribute("data-id");

      if (e.target.classList.contains("btn-edit")) {
        card.classList.add("editing");
        card.querySelector(".view-actions").classList.add("hidden");
        card.querySelector(".edit-grid").classList.remove("hidden");
        return;
      }
      if (e.target.classList.contains("btn-cancel")) {
        card.classList.remove("editing");
        card.querySelector(".view-actions").classList.remove("hidden");
        card.querySelector(".edit-grid").classList.add("hidden");
        render();
        return;
      }
      if (e.target.classList.contains("btn-save")) {
        var anon = card.querySelector(".edit-anon").value === "1";
        var payload = {
          text: card.querySelector(".edit-text").value,
          anonymous: anon,
          author: anon ? "" : card.querySelector(".edit-author").value,
          tone: card.querySelector(".edit-tone").value
        };
        e.target.disabled = true;
        fetch(API + "/stories/" + encodeURIComponent(id), {
          method: "PATCH",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload)
        })
          .then(function (r) {
            return r.json().then(function (data) {
              if (!r.ok) throw new Error(data.message || data.error || "save");
              return data.story;
            });
          })
          .then(function (story) {
            stories = stories.map(function (s) { return s.id === id ? story : s; });
            showToast("Збережено");
            render();
          })
          .catch(function (err) {
            showToast(err.message || "Помилка збереження");
            e.target.disabled = false;
          });
        return;
      }
      if (e.target.classList.contains("btn-delete")) {
        if (!confirm("Видалити цю картку назавжди?")) return;
        e.target.disabled = true;
        fetch(API + "/stories/" + encodeURIComponent(id), {
          method: "DELETE",
          headers: authHeaders()
        })
          .then(function (r) {
            return r.json().then(function (data) {
              if (!r.ok) throw new Error(data.message || data.error || "delete");
              return data;
            });
          })
          .then(function () {
            stories = stories.filter(function (s) { return s.id !== id; });
            showToast("Видалено");
            render();
          })
          .catch(function (err) {
            showToast(err.message || "Помилка видалення");
            e.target.disabled = false;
          });
      }
    });

    list.addEventListener("change", function (e) {
      if (!e.target.classList.contains("edit-anon")) return;
      var card = findCard(e.target);
      var author = card.querySelector(".edit-author");
      var anon = e.target.value === "1";
      author.disabled = anon;
      if (anon) author.value = "";
    });

    loginBtn.addEventListener("click", login);
    password.addEventListener("keydown", function (e) {
      if (e.key === "Enter") login();
    });
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("refreshBtn").addEventListener("click", function () {
      loadStories().then(function () { showToast("Оновлено"); }).catch(function () { showToast("Помилка оновлення"); });
    });
    search.addEventListener("input", render);

    checkSession();
  })();
  </script>
</body>
</html>
